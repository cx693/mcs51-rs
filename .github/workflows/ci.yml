name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: build + test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      # 只跑不拦：公共仓库里 rustc/clippy 升一个小版本就可能多出几条 lint，
      # 因为风格提示把 CI 弄红对贡献者不友好。真错了由下面的测试兜住。
      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

      # 整条链路（汇编 → 链接 → Intel HEX → 模拟器）都在这里闭环：
      # 不需要 SDCC、不需要硬件、不需要串口。
      - name: Test
        run: cargo test --workspace
